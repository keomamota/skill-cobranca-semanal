<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FFD60A; }
      #root { width: 100%; height: 100%; position: relative; background: #FFD60A; }
      .wipe { position: absolute; top: 0; width: 244px; height: 1080px; background: #111; z-index: 100; }
      #fade { position: absolute; inset: 0; background: #111; opacity: 0; z-index: 110; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="54" data-width="1920" data-height="1080">
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="6.48" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="6.48" data-duration="8.64" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="15.12" data-duration="8.64" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="23.76" data-duration="10.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="34.56" data-duration="12.24" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="46.8" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div class="wipe" style="left:0"></div><div class="wipe" style="left:240px"></div><div class="wipe" style="left:480px"></div><div class="wipe" style="left:720px"></div>
      <div class="wipe" style="left:960px"></div><div class="wipe" style="left:1200px"></div><div class="wipe" style="left:1440px"></div><div class="wipe" style="left:1680px"></div>
      <div id="fade"></div>
      <audio id="trilha" src="assets/trilha.mp3" data-start="0" data-duration="54" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const strips = gsap.utils.toArray(".wipe");
      gsap.set(strips, { yPercent: 100 });
      [6.9, 16.1, 25.3, 36.8, 46].forEach((T) => {
        strips.forEach((el, i) => {
          tl.fromTo(el, { yPercent: 100 }, { yPercent: 0, duration: 0.32, ease: "power3.in", immediateRender: false }, T - 0.34 + i * 0.025);
          tl.fromTo(el, { yPercent: 0 }, { yPercent: -100, duration: 0.32, ease: "power3.out", immediateRender: false }, T + 0.02 + i * 0.025);
        });
      });
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.in", immediateRender: false }, 56.7);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
